[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-detection-engine"
version = "0.1.0"
description = "Generic anomaly detection engine with sports odds as the initial use case."
requires-python = ">=3.11"
dependencies = [
    "rapidfuzz>=3.9,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
